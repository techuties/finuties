name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: terminal/package-lock.json

      - name: Validate notebooks (static)
        run: node tools/validate-notebooks.mjs

      - name: Terminal unit tests
        working-directory: terminal
        run: |
          npm ci
          npm test
