[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finuties-api"
version = "0.1.0"
description = "FinUties REST API query contract and P0 route helpers"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["finuties_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
